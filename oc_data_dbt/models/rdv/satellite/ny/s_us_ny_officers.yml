version: 2

models:
  - name: s_us_ny_officers
    description: "Satellite model for NY companies officers information. Tracks CEO and officer attributes and changes over time."
    columns:
      - name: DOS_ID
        description: "Department of State ID for the company. Business key."
        tests:
          - not_null
      - name: ceo_name
        description: "Chief Executive Officer name."
      - name: ceo_address_1
        description: "CEO address line 1."
      - name: ceo_address_2
        description: "CEO address line 2."
      - name: ceo_city
        description: "CEO address city."
      - name: ceo_state
        description: "CEO address state."
      - name: ceo_zip
        description: "CEO address zip code."

      - name: _meta_load_timestamp
        description: "Timestamp when the data was loaded."
      - name: _meta_source_system
        description: "Name of the source system." 